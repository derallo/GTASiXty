<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>GTA-Sixty Direct</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; user-select: none; }
    #v {
      width: 100%; height: 100%; object-fit: contain; background: #000; display: block;
    }
    #v.gl-hidden {
      position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0.001; pointer-events: none;
    }
    #c {
      width: 100%; height: 100%; object-fit: contain; background: #000; display: none;
    }
    #hud {
      position: fixed; left: 10px; top: 10px; padding: 4px 8px; border-radius: 5px;
      background: rgba(0,0,0,0.55); color: #86efac; font: 12px/1.4 monospace; white-space: pre;
      pointer-events: none; display: none;
    }
    #err {
      position: fixed; left: 10px; bottom: 10px; right: 10px; padding: 8px; border-radius: 5px;
      background: rgba(120,0,0,0.8); color: #fff; font: 13px/1.4 monospace; display: none;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <video id="v" autoplay muted playsinline></video>
  <canvas id="c"></canvas>
  <audio id="a" autoplay></audio>
  <div id="hud">direct: idle</div>
  <div id="err"></div>
  <script src="direct.js"></script>
</body>
</html>
